name: wheelchair_manual
extends: adult
interaction_class: wheelchair
assets: [human::mobility::wheelchair]
climbs: []

agent_radius: 0.325
desired_velocity: {mean: 0.9, std: 0.15, clip_low: 0.3, clip_high: 1.4}
max_acceleration: {mean: 1.2, std: 0.1, clip_low: 0.5, clip_high: 2.5}
min_turning_radius: 0.05
pivot_angular_velocity: {mean: 1.2, std: 0.2, clip_low: 0.6, clip_high: 2.0}

local_planner: hsfm
local_planner_params:
  lateral_gain: 0.0
  heading_source: total

# Corridors and narrow passages (global_planner/navmesh.py and wall_following.py, core/locomotion.py). Off: every field
# 0, or no block, gives the behaviour the type had before.
#   lane_width 0.915 m: clear width of an accessible route, 36 in (2010 ADA Standards 403.5.1). The chair keeps the
#     middle of a lane this wide on the crowd's side (global_planner.lane_side) of a corridor.
#   corridor_width 3.6 m: a lane is kept between walls closer than this. No source, our choice (twice two_way_width).
#   two_way_width 1.8 m: a narrower stretch is taken by one direction of wheelchair users at a time. "A clear width of
#     1800mm will allow two wheelchair users to pass each other" (Singapore BCA Code on Accessibility in the Built
#     Environment 2019, Fig. 15, and 4.2.1.2 passing spaces). The ADA figure is 60 in, 1525 mm (2010 ADA 403.5.3).
#     ISO 21542 and DIN 18040-1 (1.8 m) were seen in secondary sources only: not verified.
#   hold_back 1.5 m: a waiting chair stops at least this far before the stretch. No source, our choice (the size of a
#     turning space, 2010 ADA 304.3.1, by analogy).
#   queue_space 1.22 m: floor one chair takes in a queue, 48 in (2010 ADA 305.3, clear floor space 30 x 48 in).
# That wheelchair users wait is observed ("much more likely to stop and wait", Geoerg, Schumann, Boltes & Kinateder
# 2022, Sci. Rep. 12:14273, one-way bottlenecks). Who goes first (the end that came first) is our rule: no study of
# wheelchair users in two-way passages was found.
passage:
  lane_width: 0.915
  corridor_width: 3.6
  two_way_width: 1.8
  hold_back: 1.5
  queue_space: 1.22

locomotion:
  kinematics: along_heading
  cadence: {base: 0.6, per_speed: 0.4, min: 0.6, max: 1.4}
  speed_profile:
    harmonics: [[0.12, 0.0], [0.05, 1.1]]
    amplitude_scale: {mean: 1.0, std: 0.15, clip_low: 0.5, clip_high: 1.5}
  footprint_length: 1.1
  recovery: {stall_after_s: 3.0, reverse_m: 0.3}

pose:
  walk:
    base: seated_wheelchair
    symmetric: false
    gain: {min: 1.0, max: 1.0}
    limits:
      l_elbow: [-0.25, 2.5]
      r_elbow: [-0.25, 2.5]
      l_p_collar: [-0.45, 0.6]
      r_p_collar: [-0.45, 0.6]
    joints:
      l_y_shoulder: {set: {mean: 1.9696, harmonics: [[0.7457, 2.1307], [0.0928, -1.314], [0.0824, -0.112]]}}
      r_y_shoulder: {set: {mean: -1.9696, harmonics: [[0.7457, -1.0109], [0.0928, 1.8276], [0.0824, 3.0296]]}}
      l_p_shoulder: {set: {mean: 0.5458, harmonics: [[0.1053, -2.4319], [0.123, 2.1814], [0.019, -0.6204]]}}
      r_p_shoulder: {set: {mean: 0.5458, harmonics: [[0.1053, -2.4319], [0.123, 2.1814], [0.019, -0.6204]]}}
      l_r_shoulder: {set: {mean: 1.8955, harmonics: [[0.7525, 2.0978], [0.0648, -0.8767], [0.0256, 1.1431]]}}
      r_r_shoulder: {set: {mean: -1.8955, harmonics: [[0.7525, -1.0438], [0.0648, 2.2649], [0.0256, -1.9985]]}}
      l_elbow: {set: {mean: 0.1592, harmonics: [[0.5002, 2.9013], [0.1301, -1.6278], [0.0426, 0.2387]]}}
      r_elbow: {set: {mean: 0.1592, harmonics: [[0.5002, 2.9013], [0.1301, -1.6278], [0.0426, 0.2387]]}}
      waist: {set: {mean: -0.0719, harmonics: [[0.0939, -2.6381], [0.0615, 2.5759]]}}
      p_head: {set: {mean: -0.1719, harmonics: [[0.0939, -2.6381], [0.0615, 2.5759]]}}
      l_p_collar: {set: {mean: -0.1354, harmonics: [[0.1924, 1.6138], [0.073, -1.4867]]}}
      r_p_collar: {set: {mean: -0.1354, harmonics: [[0.1924, 1.6138], [0.073, -1.4867]]}}
  idle:
    base: seated_wheelchair
  run:
    same_as: walk
    gain: {factor: 1.0}
  while:
    PUSH_WHEELCHAIR:  # pushed by a caregiver: hands resting on the thighs, the wheels roll on their own
      walk: {base: seated_wheelchair_lap}
      run: {same_as: walk}
      idle: {base: seated_wheelchair_lap}
