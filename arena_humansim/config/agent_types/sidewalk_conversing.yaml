# A pedestrian in a group that starts a face-to-face conversation once the robot is within 10 m ahead.
name: sidewalk_conversing
extends: adult
mode: behavior_tree
initial_sequence: idle
sequences:
  idle:
    steps:
      watch: {kind: robot, when: {ahead: 10.0}}
    then: converse
  converse:
    then: done
    steps:
      talk: {interaction: GROUP_CONVERSATION, duration: {mean: 300.0}}
  done:
    steps:
      rest: {duration: {mean: 3600.0}}
